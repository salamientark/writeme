name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v1.0.0-go.1)'
        required: true
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race -cover ./...

  goreleaser:
    needs: test
    if: github.event_name == 'push' || github.event.inputs.draft == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

  goreleaser-dry-run:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum

      - name: Run goreleaser (dry-run)
        run: goreleaser release --snapshot --clean --skip=sign,sbom,publish

      - name: Show artifacts
        run: |
          echo "Snapshot built. Artifacts:"
          ls -la dist/
