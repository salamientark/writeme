name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run (must already exist, e.g. v0.1.2)'
        required: true
      dry_run:
        description: 'Skip branch push and gh release create'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve tag commit SHA
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "invalid VERSION: $VERSION" >&2
            exit 1
          fi
          SHA=$(git rev-parse "${VERSION}^{commit}")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "Tag ${VERSION} -> commit ${SHA}"

      - name: Pin EXPECTED_SHA in install.sh
        run: |
          python - <<'PY'
          import os, re, pathlib
          sha = os.environ["SHA"]
          p = pathlib.Path("install.sh")
          src = p.read_text()
          new = re.sub(
              r'EXPECTED_SHA="\$\{EXPECTED_SHA:-[0-9a-f]{40}\}"',
              f'EXPECTED_SHA="${{EXPECTED_SHA:-{sha}}}"',
              src,
              count=1,
          )
          if new == src:
              raise SystemExit("EXPECTED_SHA placeholder not found in install.sh")
          p.write_text(new)
          PY
          grep -n EXPECTED_SHA install.sh | head -3

      - name: Create release branch with pinned SHA
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/${VERSION}"
          git checkout -b "${BRANCH}"
          git commit -am "chore: pin EXPECTED_SHA for ${VERSION}"
          git push origin "${BRANCH}"

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/RELEASE-NOTES-${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --notes-file "$NOTES" \
              install.sh gh_readme_pipeline.py
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --generate-notes \
              install.sh gh_readme_pipeline.py
          fi

      - name: Fast-forward latest branch
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        run: |
          git push origin "+HEAD:refs/heads/latest"

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN — no branch pushed, no release created."
          echo "Would pin SHA=${SHA} on release/${VERSION}"
          echo "Would attach: install.sh gh_readme_pipeline.py"
