name: go

on:
  push:
    branches: [main, feat-go-port]
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -cover ./...
      - name: Per-package coverage gate (ubuntu only, G9)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -cover ./... | tee coverage.txt
          bash scripts/coverage_gate.sh coverage.txt
      - name: Coverage gate self-test (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/coverage_gate_test.sh

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5
          working-directory: go
