version: "2"

run:
  timeout: 5m
  go: "1.23"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/salamientark/writeme/internal/sandbox.Job).Cleanup
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - errcheck
      - path: (.+)\.go$
        text: "Error return value is not checked"
        source: "defer "

formatters:
  enable:
    - gofmt
    - goimports
